listen: "0.0.0.0:8080"
metrics_listen: "127.0.0.1:9090"
workers: 1

load_balancing:
  strategy: "round_robin"

limits:
  max_client_connections: 10000
  max_pending_per_backend: 1024
  client_header_timeout_ms: 2000
  upstream_connect_timeout_ms: 500
  request_timeout_ms: 5000
  max_buffer_bytes: 1048576

backends:
  - name: "backend-a"
    url: "http://127.0.0.1:9001"
    max_connections: 1024
    health_check:
      path: "/healthz"
      interval_ms: 1000
      timeout_ms: 200
      unhealthy_threshold: 3
      healthy_threshold: 2
  - name: "backend-b"
    url: "http://127.0.0.1:9002"
    max_connections: 1024
    health_check:
      path: "/healthz"
      interval_ms: 1000
      timeout_ms: 200
      unhealthy_threshold: 3
      healthy_threshold: 2
  - name: "backend-c"
    url: "http://127.0.0.1:9003"
    max_connections: 1024
    health_check:
      path: "/healthz"
      interval_ms: 1000
      timeout_ms: 200
      unhealthy_threshold: 3
      healthy_threshold: 2
